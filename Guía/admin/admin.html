<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administración | YaZú</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <script type="module" src="/admin/admin.js"></script>
</head>
<body>
  <div id="auth" class="auth-wrap">
    <form id="login" class="panel auth-panel">
      <img class="logo" src="/assets/logo_yazu.png" alt="YaZú">
      <p class="eyebrow">ACCESO ADMINISTRADOR</p><h1>Iniciar sesión</h1>
      <p>Accede a tu espacio de administración.</p>
      <label>Correo electrónico<input name="email" type="email" required autocomplete="email"></label>
      <label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="button" type="submit">Iniciar sesión</button>
      <button class="link-button" type="button" id="forgot">¿Olvidaste tu contraseña?</button>
    </form>
    <form id="new-password" class="panel auth-panel" hidden>
      <p class="eyebrow">ACCESO ADMINISTRADOR</p><h1>Crear contraseña</h1>
      <label>Nueva contraseña<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
      <label>Confirmar contraseña<input type="password" name="confirm" minlength="8" required autocomplete="new-password"></label>
      <button class="button" type="submit">Guardar contraseña</button>
    </form>
  </div>
  <div id="app" class="layout" hidden>
    <aside class="sidebar">
      <a href="/" class="side-brand"><img class="logo" src="/assets/logo_yazu.png" alt="YaZú"></a>
      <p class="eyebrow">ADMINISTRACIÓN</p>
      <nav aria-label="Administración"><button data-view="productos">Productos</button><button data-view="galeria">Galería</button><button data-view="usuarios">Usuarios</button></nav>
      <a href="/">Ver página pública ↗</a><button id="logout" class="link-button">Cerrar sesión</button>
    </aside>
    <main class="workspace"><header class="topbar"><span>YaZú / Administración</span><button id="logout-mobile" class="link-button">Cerrar sesión</button></header><div id="content"></div></main>
  </div>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <div id="context-menu" class="context-menu" hidden></div>
  <div id="status" role="status" aria-live="polite" hidden></div>
</body>
</html>
